<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <section class="logo">
            <a href="./index.html"><img src="./img/logo.png" alt="logo"></a>
        </section>

        <nav class="contenedor-padre-navegacion">
            <ul class="barra-navegacion">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./registro.html">Registro</a></li>
                <!-- FALTA "Formulario con buscador" -->
            </ul>
        </nav>
    </header>
    <!-- --------------------------------------------------------------------------------->

    <div class="contenedor-padre-formulario">
        <h1 id="titulo-primernivel">Registrarse</h1>
        <form  class="formulario-registro" action="./login.html" method="get">
            <div>
                <label class="informacion-individual" for="mail">Email</label>
                <input class="mail" type="email" name="mail" value="" required>
            </div>
            <div>
                <label class="informacion-individual" for="contraseña">Password</label>
                <input class="contraseña" type="password" name="contraseña" value="" required>
            </div>
            <div>
                <label class="informacion-individual" for="contraseña">Repetir contraseña</label>
                <input class="contraseña" type="password" name="contraseña" value="" required>
            </div>
            <div>
                <input type="checkbox" name="condiciones" value="Si">
                <label id="condiciones" for="condiciones">Acepto términos y condiciones</label>
            </div>
            <div class="contenedor-registro">
                <button class="button-registro" type="submit">Registrarme</button>
            </div>
            <a id="tengo-cuenta" href="./login.html">Ya tengo una cuenta</a>
        </form>
    </div>

    <!-- ------------------------------------------------------------------------------- -->
    <footer class="pie-pagina">
        <ul class="nombres-piedepagina">
            <li>Franco Dragani</li>
            <li>Michelle Zac</li>
            <li>Joaquin Pedernera</li>
        </ul>
        <div class="udesa-digitalhouse">
            <img src="./img/UdeSA.png" alt="Universidad de San Andrés">
            <img src="./img/digitalHouse.png" alt="Digital House">
        </div>
    </footer>
</body>

</html>
