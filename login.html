<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <section class="logo">
            <a href="./index.html"><img src="./img/logo.png" alt="logo"></a>
        </section>

        <nav class="contenedorPadreNavegacion">
            <ul class="barraNavegacion">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./registro.html">Registro</a></li>
            </ul>
        </nav>

        <form class="contenedorBarraBuscar" action="./resultadosBusqueda.html" method="get">
            <input type="search" name="barrabuscar" placeholder="Buscar..." id="buscar">
            <button type="submit">Enviar</button>
        </form>
    </header>

    <section class="contenedorPadreFormulario">
        <h1>Login</h1>
        <form class="formularioRegistroLogin" action="./index.html" method="get">
            <p class="textoLogin">Usuario</p>
            <input type="email" id="correoElectronico" name="email" >
            <p class="errorLogin_usuario"></p>
            <p class="textoLogin">Contraseña</p>
            <input type="password" id="password" name="password" >
            <p class="errorLogin_contrasena"></p>
            <input class="botonSubmit" type="submit" value="Ingresar">
            <a id="tengoCuenta" href="./registro.html">No tengo cuenta</a>
            <p class="errorGeneral"></p>
        </form>
    </section>
    <footer>
        <ul class="nombresPieDePagina">
            <li>Franco Dragani</li>
            <li>Michelle Zac</li>
            <li>Joaquin Pedernera</li>
        </ul>
        <section class="udesaDigitalHouse">
            <img src="./img/UdeSA.png" alt="Universidad de San Andrés">
            <img src="./img/digitalHouse.png" alt="Digital House">
        </section>
    </footer>
    <script src="./js/login.js"></script>
</body>

</html>
